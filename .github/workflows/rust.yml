name: Rust migration

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format sources on CI
        run: cargo fmt --all

      - name: Upload formatted gateway source
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: formatted-gateway-source
          path: src/gateway.rs
          if-no-files-found: error
          retention-days: 1

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --locked --all-targets --all-features

      - name: Build
        run: cargo build --locked --release --all-features

      - name: Upload Windows binary
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: magpie-rust-migration-${{ runner.os }}-${{ runner.arch }}
          path: target/release/magpie.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload Unix binary
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: magpie-rust-migration-${{ runner.os }}-${{ runner.arch }}
          path: target/release/magpie
          if-no-files-found: error
          retention-days: 14
