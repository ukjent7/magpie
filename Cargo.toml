[package]
name = "magpie"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "A model switchboard for local AI coding agents"

[[bin]]
name = "magpie"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
jsonc-parser = { version = "0.33.2", features = ["cst", "serde_json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml_edit = "0.25"
yaml-edit = "0.2.3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
