[package]
name = "magpie"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT"
description = "A model switchboard for local AI coding agents"

[[bin]]
name = "magpie"
path = "src/main.rs"

[dependencies]
aes-gcm = { version = "0.11.1", default-features = false, features = ["aes", "alloc"] }
anyhow = "1.0.104"
axum = "0.8.9"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
futures-util = "0.3.34"
getrandom = "0.4.3"
jsonc-parser = { version = "0.33.2", features = ["cst", "serde_json"] }
pbkdf2 = { version = "0.13.0", features = ["hmac", "sha2"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
reqwest = { version = "0.13.5", default-features = false, features = ["http2", "rustls", "stream"] }
rpassword = "7.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
time = { version = "0.3.55", features = ["formatting", "local-offset", "parsing"] }
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
toml_edit = "0.25.15"
url = "2.5.8"
yaml-edit = "0.3.2"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
