[package]
name = "magpie"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
description = "A model switchboard for local AI coding agents"

[[bin]]
name = "magpie"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive"] }
jsonc-parser = { version = "0.33.2", features = ["cst", "serde_json"] }
reqwest = { version = "0.13.5", default-features = false, features = ["http2", "rustls", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "signal"] }
toml_edit = "0.25.15"
url = "2.5.8"
yaml-edit = "0.3.2"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
